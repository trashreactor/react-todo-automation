name: CI

on:
  push:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  dev-tests-gate:
    name: Dev Tests Gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  qa-e2e-tests-gate:
    name: QA E2E Tests Gate
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa-automation/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: qa-automation
      - run: npx playwright install --with-deps chromium
        working-directory: qa-automation
      - run: npm test
        working-directory: qa-automation

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: qa-automation/playwright-report/
          retention-days: 7
