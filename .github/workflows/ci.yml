name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa-automation/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: qa-automation
      - run: npx playwright install --with-deps chromium
        working-directory: qa-automation
      - run: npm test
        working-directory: qa-automation

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: qa-automation/playwright-report/
          retention-days: 7
